<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Dveej red neon profile banner</title><desc id="desc">Dark cyberpunk banner with glowing red lines and DVE EJ title.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#210000"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff1717" stop-opacity=".28"/><stop offset="1" stop-color="#ff1717" stop-opacity="0"/></radialGradient>
 <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ff3030" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="360" fill="url(#bg)"/><rect width="1200" height="360" fill="url(#grid)"/>
<circle cx="600" cy="160" r="310" fill="url(#glow)"/>
<path d="M0 55H260l28 28h120M1200 70H970l-30 30H820M0 300h230l35-35h170M1200 290H980l-30-30H810" fill="none" stroke="#ff2525" stroke-width="2" opacity=".75" filter="url(#neon)"/>
<path d="M0 115h180l18 18h95M1200 130h-190l-20 20h-80M0 235h140l25-25h110M1200 225h-160l-25-25h-95" fill="none" stroke="#ff3030" stroke-width="1.5" opacity=".45"/>
<g fill="#ff3434" opacity=".85"><circle cx="260" cy="83" r="3"/><circle cx="940" cy="100" r="3"/><circle cx="300" cy="265" r="3"/><circle cx="900" cy="260" r="3"/></g>
<text x="600" y="158" text-anchor="middle" fill="#ff3030" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="17" filter="url(#neon)">DVEEJ</text>
<text x="600" y="211" text-anchor="middle" fill="#f4eeee" font-family="Arial,sans-serif" font-size="19" letter-spacing="5">AI &amp; ML STUDENT  •  DEVELOPER  •  BUILDER</text>
<path d="M360 245H840" stroke="#ff3030" stroke-width="2" filter="url(#neon)"/>
<text x="600" y="290" text-anchor="middle" fill="#ff7777" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">LEARN  /  BUILD  /  EXPERIMENT  /  IMPROVE</text>
</svg>