<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Dveej Kotiya — AI and ML Explorer</title>
<desc id="desc">Animated red and blue neon wave header with a glowing title.</desc>
<defs>
