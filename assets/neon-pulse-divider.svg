<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="36" viewBox="0 0 1000 36" fill="none">
  <defs>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff244d"><animate attributeName="stop-color" values="#ff244d;#ff8a3d;#ff244d" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#1687e8"><animate attributeName="stop-color" values="#1687e8;#ff244d;#1687e8" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff244d"><animate attributeName="stop-color" values="#ff244d;#1687e8;#ff244d" dur="5s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M8 18H992" stroke="url(#pulseLine)" stroke-width="2" opacity=".9" filter="url(#neonGlow)"/>
  <path d="M8 18H992" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 34" filter="url(#neonGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-360" dur="3.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="500" cy="18" r="3.5" fill="#fff" filter="url(#neonGlow)"><animate attributeName="r" values="2.5;5.5;2.5" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;1;.5" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="18" r="10" stroke="#38bdf8" stroke-opacity=".75" stroke-width="1"><animate attributeName="r" values="5;17;5" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" repeatCount="indefinite"/></circle>
<!-- Twin comet pulses travel in opposite directions -->
<g filter="url(#neonGlow)">
 <circle cx="0" cy="18" r="3" fill="#fff"><animate attributeName="cx" values="0;1000" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="1000" cy="18" r="2.5" fill="#38bdf8"><animate attributeName="cx" values="1000;0" dur="4.1s" repeatCount="indefinite"/></circle>
 <path d="M0 18H1000" stroke="#ff4568" stroke-opacity=".18" stroke-width="7">
  <animate attributeName="stroke-opacity" values=".08;.4;.08" dur="2s" repeatCount="indefinite"/>
 </path>
</g>
</svg>