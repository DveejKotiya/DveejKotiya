name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution graph snake
        uses: Platane/snk@v3
        with:
          github_user_name: DveejKotiya
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update animated contribution snake"
          git push
